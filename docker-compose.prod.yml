# Production stack — app + Postgres 16, for a Dokploy "Compose" deployment or a
# plain `docker compose -f docker-compose.prod.yml up -d` on the VPS.
#
# Deliberately different from docker-compose.yml (which is the local dev
# database only, on port 5433 with throwaway credentials).
#
# Required env — Dokploy injects these from its Environment tab; with plain
# compose, put them in a `.env` next to this file:
#   POSTGRES_PASSWORD, AUTH_SECRET, AUTH_URL, CRON_SECRET, GEMINI_API_KEY

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: aem
    volumes:
      - aem_pgdata:/var/lib/postgresql/data
    # Internal network only — deliberately NOT on dokploy-network, which is
    # shared with Traefik and every other app on the box. And no `ports:`, so
    # the database is unreachable from outside this stack. Use
    # `docker compose exec postgres …` to get at it.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aem -d aem"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aem:${POSTGRES_PASSWORD}@postgres:5432/aem?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      # Auth.js v5 refuses to trust a proxied Host header unless one of
      # AUTH_URL / AUTH_TRUST_HOST is set. Behind Dokploy's Traefik, both the
      # canonical URL and the trust flag are needed for callbacks and secure
      # cookies to resolve correctly.
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required, e.g. https://aem.example.com}
      AUTH_TRUST_HOST: "true"
      CRON_SECRET: ${CRON_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: "3000"
    # Traefik reaches this container over dokploy-network; Dokploy writes the
    # router labels when you add a Domain against service `app`, port 3000.
    # No `ports:` — publishing would bypass the proxy and put the app on a raw
    # host port. For a bare `docker compose up` without Dokploy, uncomment:
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    networks:
      - internal
      - dokploy-network

networks:
  internal:
  # Created by the Dokploy installer. Without Dokploy, run once:
  #   docker network create dokploy-network
  dokploy-network:
    external: true

volumes:
  aem_pgdata:
